name: Release

on:
  push:
    tags: ["v*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { goarch: amd64, cc: "" }
          - { goarch: arm64, cc: aarch64-linux-gnu-gcc }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install cross-compiler (arm64)
        if: matrix.goarch == 'arm64'
        run: sudo apt-get update -qq && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binaries
        env:
          GOOS:        linux
          GOARCH:      ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC:          ${{ matrix.cc }}
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"

          go build \
            -ldflags="-s -w -X main.version=${TAG}" \
            -o "dist/cipher-shield-server-linux-${{ matrix.goarch }}" \
            ./cmd/server/

          go build \
            -ldflags="-s -w -X main.version=${TAG}" \
            -o "dist/cipher-shield-proxy-linux-${{ matrix.goarch }}" \
            ./cmd/proxy/

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.goarch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**
          generate_release_notes: true
